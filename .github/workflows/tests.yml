# Runs the test suite on Windows PowerShell 5.1, the shell powershell10k
# targets. The runner loads the bundled PSReadLine when the image's is older.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\run-tests.ps1
